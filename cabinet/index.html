<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabinet head draft</title>
<style>
  html,body{margin:0;height:100%;background:#fff;font:13px/1.3 system-ui,sans-serif;color:#222}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{position:relative;aspect-ratio:716/950;height:100%;max-width:100%}
  #frame canvas,#frame img{position:absolute;inset:0;width:100%;height:100%}
  #frame{background:url(still.webp) center/100% 100% no-repeat}   /* a render of the scene, shown while it loads */
  #frame canvas{opacity:0;transition:opacity .5s} #frame.ready canvas{opacity:1}
  #frame img{pointer-events:none;opacity:0}
  #ui{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#fffd;padding:6px 8px;border:1px solid #ddd}
  #ui button{font:inherit;padding:3px 8px;border:1px solid #bbb;background:#fff;cursor:pointer}
  #ui button[aria-pressed=true]{background:#222;color:#fff}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="stage"><div id="frame"><img id="ref" alt=""></div></div>
<div id="ui">
  <button id="bPhoto" aria-pressed="true">Photo view</button>
  <button id="bOrbit" aria-pressed="false">Orbit</button>
  <button id="bBaked">Baked</button>
  <button id="bFlat">Flat (v1)</button>
  <button id="bClose" aria-pressed="false">Eye close-up</button>
  <button id="bBlink">Blink</button>
  <button id="bRig">Eyes: Source</button>
  <button id="bFilter">Filter: off</button>
  <label>Photo overlay <input id="ov" type="range" min="0" max="1" step="0.05" value="0"></label>
</div>
<script>addEventListener("error",e=>document.title="ERR "+e.message);addEventListener("unhandledrejection",e=>document.title="ERR "+e.reason)</script>
<script type="module">
// ?v1 = the first flat photo-texture prototype (v1.js); default = the light-baked build (main.js)
const q = new URLSearchParams(location.search), v1 = q.has('v1');
document.getElementById(v1 ? 'bFlat' : 'bBaked').ariaPressed = 'true';
document.getElementById(v1 ? 'bBaked' : 'bFlat').ariaPressed = 'false';
const go = on => { on ? q.set('v1', '') : q.delete('v1'); location.search = q.toString().replace(/=(&|$)/g, '$1'); };
document.getElementById('bBaked').onclick = () => v1 && go(false);
document.getElementById('bFlat').onclick = () => v1 || go(true);
const bClose = document.getElementById('bClose'); bClose.ariaPressed = String(q.has('close'));
bClose.onclick = () => { q.has('close') ? q.delete('close') : q.set('close', ''); location.search = q.toString().replace(/=(&|$)/g, '$1'); };
const bRig = document.getElementById('bRig'); bRig.textContent = 'Eyes: ' + (q.has('raz') ? 'Raz (proto)' : 'Source'); bRig.hidden = v1;   // PROTOTYPE toggle, Baked only
bRig.onclick = () => { q.has('raz') ? q.delete('raz') : q.set('raz', ''); location.search = q.toString().replace(/=(&|$)/g, '$1'); };
document.getElementById('bBlink').onclick = () => window.__blink?.();
const FILTERS = ['off', 'pixel', 'ps2'], fNow = FILTERS.includes(q.get('filter')) ? q.get('filter') : 'off', bFilter = document.getElementById('bFilter');
bFilter.textContent = 'Filter: ' + fNow;
bFilter.onclick = () => { const n = FILTERS[(FILTERS.indexOf(fNow) + 1) % FILTERS.length]; n === 'off' ? q.delete('filter') : q.set('filter', n); location.search = q.toString().replace(/=(&|$)/g, '$1'); };
import(v1 ? './v1.js?v=11' : './main.js?v=15');
</script>
</body>
</html>
